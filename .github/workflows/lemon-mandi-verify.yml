# Lemon Mandi regression suite — no secrets required.
name: Lemon Mandi verify

on:
  pull_request:
    paths:
      - "frontend/**"
      - "docs/FEATURE_INVENTORY.md"
      - "docs/RELEASE_CHECKLIST.md"
      - "docs/BUILD_PROVENANCE.md"
      - "docs/RECOVERY_REPORT.md"
      - ".github/workflows/lemon-mandi-verify.yml"
  push:
    branches:
      - main
      - "cursor/permanent-feature-recovery-*"
      - "cursor/integrate-cash-chart-upi-*"
    paths:
      - "frontend/**"
      - "docs/**"
      - ".github/workflows/lemon-mandi-verify.yml"

jobs:
  release-gate:
    name: Release gate (automated)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-fund --no-audit

      - name: Print provenance
        run: |
          echo "branch=${{ github.ref_name }}"
          echo "sha=${{ github.sha }}"
          git rev-parse HEAD
          git status -sb

      - name: Run release gate
        run: npm run verify:release
